name: jwstreak
description: "A local-first Bible reading habit tracker with quizzes, streaks and personal notes."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
#
# Versioning policy for this app:
#   +0.0.1  bug fix or small change
#   +0.1.0  a small new feature
#   +1.0.0  a lot of big changes — only a few times a year at most
# The build number after the "+" must increase on every release built for
# distribution, even a rebuild of the same version name; it is never shown to
# the user, only Android uses it to tell two builds apart.
version: 1.5.0+10

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_local_notifications: ^22.2.0
  flutter_timezone: ^5.1.0
  intl: ^0.20.2
  dynamic_color: ^1.8.0
  package_info_plus: ^10.2.1
  path: ^1.9.1
  sqflite: ^2.4.2
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  path_provider: ^2.1.5
  pdf: ^3.13.0
  timezone: ^0.11.1
  flutter_markdown: ^0.7.3
  vibration: ^3.0.0
  permission_handler: ^11.3.1
  local_auth: ^3.0.2
  archive: ^4.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  # Only used for its `dart run flutter_native_splash:create` codegen step
  # (regenerates android/app/src/main/res/drawable*/launch_background.xml and
  # the values*/styles.xml splash themes) — nothing in app code calls its
  # Dart API, so it doesn't need to ship in the app itself.
  flutter_native_splash: ^2.4.8

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Only what Dart code actually loads at runtime. assets/icon.png is
  # deliberately NOT here: it's a build-time source (the launcher/notification
  # icon pipeline in tool/icons/, and flutter_native_splash) whose output is
  # baked into Android resources, so bundling it again would ship a second,
  # never-loaded copy inside the APK.
  assets:
    - assets/icon_onboarding.png

  # Bundled locally (not fetched from Google's servers at runtime like the
  # google_fonts package would) so the app never makes a network call it
  # didn't ask permission for — matches the "100% private" claim made in
  # onboarding. It's a single variable font; declaring it twice, once per
  # weight actually used in the UI, makes Flutter pick the right instance
  # from its `wght` axis. See assets/fonts/PlusJakartaSans-OFL.txt for the
  # license (SIL Open Font License).
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
          weight: 800
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Native launch splash (flutter_native_splash), regenerate with:
#   dart run flutter_native_splash:create
# This is what stays on screen for the brief window between process start
# and the DB/theme/locale read finishing (see main.dart's
# FlutterNativeSplash.preserve/.remove) — replaces the app's own spinner
# screen, which used to show as a second, separate flash after this one.
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#000000"
  image: assets/icon.png
  # Same full logo (purple square, "JWS" + flower) as the legacy splash below
  # — the isolated foreground glyph (tool/icons/icon_foreground_art.png) was
  # designed to sit inside that square, not stand alone; on its own, floating
  # on plain white, it read as a broken/disconnected shape instead of a logo.
  android_12:
    image: assets/icon.png
    icon_background_color: "#FFFFFF"
    color: "#FFFFFF"
    color_dark: "#000000"
  android: true
  ios: true
  web: false
